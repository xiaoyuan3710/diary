<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>心情日记</title>
  <meta name="description" content="记录今天的心情，回望往年的这一天">
  <meta name="theme-color" content="#f7f3ee">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 今天视图 ============ -->
  <main id="view-today" class="view active">
    <header class="today-header">
      <div class="date-big" id="today-date">—</div>
      <div class="date-sub" id="today-week">—</div>
      <div class="greeting" id="today-greeting">记录一下今天吧</div>
    </header>

    <!-- 情绪选择 -->
    <section class="card">
      <h2 class="card-title">今天的心情</h2>
      <div class="emoji-row" id="emoji-row"></div>
    </section>

    <!-- 打分 -->
    <section class="card">
      <h2 class="card-title">给自己打个分 <span class="hint">（可跳过）</span></h2>
      <div class="scores" id="scores"></div>
    </section>

    <!-- 正文 -->
    <section class="card">
      <h2 class="card-title">写点什么</h2>
      <textarea id="diary-text" class="diary-text" placeholder="今天发生了什么？此刻在想什么？……"></textarea>
    </section>

    <!-- 照片 -->
    <section class="card">
      <h2 class="card-title">照片 <span class="hint">（可选）</span></h2>
      <div class="photo-grid" id="photo-grid"></div>
      <button class="btn-secondary" id="add-photo-btn">📷 添加照片</button>
      <input type="file" id="photo-input" accept="image/*" multiple hidden>
    </section>

    <div class="save-bar">
      <button class="btn-primary" id="save-btn">保存</button>
    </div>

    <!-- 往年今日 -->
    <section class="card past-card">
      <h2 class="card-title">📜 往年今日</h2>
      <div id="past-today"></div>
    </section>
  </main>

  <!-- ============ 热力图视图 ============ -->
  <main id="view-heatmap" class="view">
    <header class="view-header">
      <button class="year-btn" id="heat-year-prev">‹</button>
      <div class="year-label" id="heat-year">2026</div>
      <button class="year-btn" id="heat-year-next">›</button>
    </header>
    <section class="card">
      <div class="heat-legend">
        <span>低落</span>
        <div class="legend-colors" id="heat-legend-colors"></div>
        <span>开心</span>
      </div>
      <div class="heatmap" id="heatmap"></div>
    </section>
    <p class="heat-tip" id="heat-tip">点击某一天可以查看或补记</p>
  </main>

  <!-- ============ 时光胶囊视图 ============ -->
  <main id="view-capsule" class="view">
    <header class="view-header">
      <div class="view-title">⏳ 时光胶囊</div>
      <button class="btn-primary small" id="new-capsule-btn">+ 写一封信</button>
    </header>
    <div id="capsule-list"></div>
  </main>

  <!-- ============ 历史视图 ============ -->
  <main id="view-history" class="view">
    <header class="view-header">
      <button class="year-btn" id="hist-month-prev">‹</button>
      <div class="year-label" id="hist-month">2026年8月</div>
      <button class="year-btn" id="hist-month-next">›</button>
    </header>
    <section class="card">
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>
  </main>

  <!-- ============ 设置视图 ============ -->
  <main id="view-settings" class="view">
    <header class="view-header">
      <div class="view-title">⚙️ 设置</div>
    </header>
    <section class="card">
      <h2 class="card-title">数据备份</h2>
      <p class="desc">所有日记只存在这台手机的浏览器里。如果你清除浏览器数据、或更换手机，日记会丢失。请定期导出备份。</p>
      <button class="btn-secondary" id="export-btn">⬇️ 导出全部数据</button>
      <button class="btn-secondary" id="import-btn">⬆️ 导入备份</button>
      <input type="file" id="import-input" accept="application/json,.json" hidden>
    </section>
    <section class="card">
      <h2 class="card-title">关于</h2>
      <p class="desc">心情日记 · 记录今天，回望往年。数据完全本地保存，无账号、无云端、无广告。</p>
    </section>
  </main>

  <!-- ============ 底部标签栏 ============ -->
  <nav id="tabbar">
    <button class="tab active" data-view="today"><span class="tab-icon">📝</span><span>今天</span></button>
    <button class="tab" data-view="heatmap"><span class="tab-icon">🌡️</span><span>热力图</span></button>
    <button class="tab" data-view="capsule"><span class="tab-icon">⏳</span><span>胶囊</span></button>
    <button class="tab" data-view="history"><span class="tab-icon">📅</span><span>历史</span></button>
    <button class="tab" data-view="settings"><span class="tab-icon">⚙️</span><span>设置</span></button>
  </nav>

  <!-- ============ 胶囊弹窗 ============ -->
  <div id="capsule-modal" class="modal hidden">
    <div class="modal-box">
      <h3>写给未来的自己</h3>
      <textarea id="capsule-content" class="diary-text" placeholder="想对未来的自己说些什么？……"></textarea>
      <div class="unlock-picker">
        <label>何时解锁</label>
        <select id="capsule-unlock">
          <option value="+1year">明年的今天</option>
          <option value="+6month">半年后</option>
          <option value="+3month">3 个月后</option>
          <option value="custom">自定义日期</option>
        </select>
        <input type="date" id="capsule-custom-date" class="hidden">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="capsule-cancel">取消</button>
        <button class="btn-primary" id="capsule-save">封存</button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
